[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cost-exchange"
version = "0.1.0"
description = "A deterministic workbench for modelling AI workflow costs before implementation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
aicx = "aicx.cli:main"

[tool.setuptools]
packages = ["aicx"]

[tool.setuptools.data-files]
"data/prices" = ["data/prices/*.yaml"]
"share/ai-cost-exchange/examples" = ["examples/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
